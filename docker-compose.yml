# SocialFlow AI — single-server MVP stack
# Public: nginx :80  |  Internal: app, n8n  |  External: MongoDB Atlas
#
# Usage:
#   cp .env.docker.example .env
#   docker compose up -d --build
#
# With n8n admin UI at /n8n:
#   docker compose --profile n8n-admin up -d --build

name: socialflow_saas

services:
  # ---------------------------------------------------------------------------
  # Reverse proxy — ONLY public-facing service
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      # Default: public app only. For n8n UI at /n8n set NGINX_CONF=./nginx/nginx.with-n8n-admin.conf
      - ${NGINX_CONF:-./nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./nginx/includes:/etc/nginx/includes:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
      n8n:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - socialflow_net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Next.js — frontend + backend API (single process)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/socialflow-generate}
      N8N_WAIT_URL: ${N8N_WAIT_URL:-http://n8n:5678/healthz}
      MEDIA_INTERNAL_BASE_URL: ${MEDIA_INTERNAL_BASE_URL:-http://app:3000}
      MEDIA_UPLOAD_DIR: /app/data/uploads
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      n8n:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - socialflow_net
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # n8n — workflow orchestration (internal network only)
  # Pinned to official stable: https://docs.n8n.io/hosting/installation/docker/
  # ---------------------------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.22.6
    restart: unless-stopped
    networks:
      - socialflow_net
    expose:
      - "5678"
    # Localhost-only publish for SSH tunnel admin (NOT reachable from the public internet).
    # On your PC: ssh -o ExitOnForwardFailure=yes -N -L 127.0.0.1:5678:127.0.0.1:5678 ubuntu@<vps-ip>
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      NODE_ENV: production
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      # Used when generating webhook URLs inside n8n (internal calls use service name)
      WEBHOOK_URL: ${N8N_PUBLIC_WEBHOOK_BASE:-http://n8n:5678}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678}
      GENERIC_TIMEZONE: ${TZ:-UTC}
      TZ: ${TZ:-UTC}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET:?Set N8N_USER_MANAGEMENT_JWT_SECRET}
      # SQLite persistence (default) — stored in volume
      DB_TYPE: sqlite
    volumes:
      - n8n_data:/home/node/.n8n
      # Mount workflow for manual import reference (read-only)
      - ./workflow.json:/import/workflow.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:5678/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Optional: Redis for queue/cache (profile: queue)
  # ---------------------------------------------------------------------------
  redis:
    profiles: [queue]
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - socialflow_net
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    profiles: [queue]
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/socialflow-generate
      REDIS_URL: redis://redis:6379
      USE_QUEUE: "true"
    depends_on:
      - redis
      - n8n
      - app
    restart: unless-stopped
    networks:
      - socialflow_net

networks:
  socialflow_net:
    driver: bridge

volumes:
  n8n_data:
    name: socialflow_n8n_data
  redis_data:
    name: socialflow_redis_data
  uploads_data:
    name: socialflow_uploads_data
