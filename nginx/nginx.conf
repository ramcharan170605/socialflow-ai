# SocialFlow AI — production reverse proxy
# Only this service should expose ports 80/443 publicly.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 4m;

    # Rate limiting for API
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

    upstream socialflow_app {
        server app:3000;
        keepalive 32;
    }

    # n8n is internal-only by default (no public upstream)
    # Enable profile "n8n-admin" and uncomment server block below for /n8n UI access

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health (for load balancers / Render)
        location = /health {
            access_log off;
            proxy_pass http://socialflow_app/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # API routes — longer timeout for AI + Firecrawl + n8n
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://socialflow_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 180s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 180s;
        }

        # Clerk auth routes
        location ~ ^/(sign-in|sign-up) {
            proxy_pass http://socialflow_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Dashboard + frontend
        location / {
            proxy_pass http://socialflow_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;
        }
    }
}
