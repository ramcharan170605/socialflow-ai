# SocialFlow AI — production reverse proxy
# Only this service should expose ports 80/443 publicly.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    include /etc/nginx/includes/cloudflare-realip.conf;

    # Cloudflare terminates visitor HTTPS; origin may be HTTP (port 80).
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    map $http_origin $cors_allow_origin {
        default $http_origin;
        ""      "";
    }

    map $http_access_control_request_headers $cors_allow_headers {
        default $http_access_control_request_headers;
        ""      "Authorization, Content-Type, Accept, Origin, User-Agent, Cache-Control, X-Requested-With";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 4m;

    # Rate limiting for API
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

    upstream socialflow_app {
        server app:3000;
        keepalive 32;
    }

    upstream n8n_backend {
        server n8n:5678;
        keepalive 16;
    }

    server {
        listen 80;
        # Self-signed origin TLS for Cloudflare "Full" (replace with CF Origin Cert for Full strict).
        listen 443 ssl;
        ssl_certificate     /etc/nginx/ssl/origin.pem;
        ssl_certificate_key /etc/nginx/ssl/origin.key;
        server_name n8n.charansurebrec.qzz.io;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        auth_basic "n8n admin";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;

        location = /health {
            access_log off;
            auth_basic off;
            proxy_pass http://n8n_backend/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # OAuth providers must be able to return authorization codes without
        # Basic Auth, while the editor and REST API remain protected.
        location = /rest/oauth2-credential/callback {
            auth_basic off;
            include /etc/nginx/includes/n8n-admin-proxy.conf;
        }

        location = /rest/oauth1-credential/callback {
            auth_basic off;
            include /etc/nginx/includes/n8n-admin-proxy.conf;
        }

        location / {
            include /etc/nginx/includes/n8n-admin-proxy.conf;
        }
    }

    server {
        listen 80 default_server;
        # Self-signed origin TLS for Cloudflare "Full" (replace with CF Origin Cert for Full strict).
        listen 443 ssl default_server;
        ssl_certificate     /etc/nginx/ssl/origin.pem;
        ssl_certificate_key /etc/nginx/ssl/origin.key;
        server_name charansurebrec.qzz.io _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health (for load balancers / Render)
        location = /health {
            access_log off;
            proxy_pass http://socialflow_app/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Public n8n trigger endpoints. These wildcard routes cover every current
        # and future workflow while the editor, REST API, MCP, and assets remain
        # private on the loopback-only n8n port.
        location ^~ /webhook/ {
            include /etc/nginx/includes/n8n-webhook-proxy.conf;
        }

        location ^~ /webhook-test/ {
            include /etc/nginx/includes/n8n-webhook-proxy.conf;
        }

        location ^~ /webhook-waiting/ {
            include /etc/nginx/includes/n8n-webhook-proxy.conf;
        }

        location ^~ /form/ {
            include /etc/nginx/includes/n8n-webhook-proxy.conf;
        }

        location ^~ /form-test/ {
            include /etc/nginx/includes/n8n-webhook-proxy.conf;
        }

        # Public n8n OAuth credential callbacks only. These exact routes let
        # external OAuth providers return authorization codes without exposing
        # the n8n editor, REST API, MCP server, or workflow APIs.
        location = /rest/oauth2-credential/callback {
            include /etc/nginx/includes/n8n-oauth-callback-proxy.conf;
        }

        location = /rest/oauth1-credential/callback {
            include /etc/nginx/includes/n8n-oauth-callback-proxy.conf;
        }

        # API routes — longer timeout for AI + Firecrawl + n8n
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://socialflow_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection "";
            proxy_read_timeout 180s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 180s;
        }

        # Clerk auth routes
        location ~ ^/(sign-in|sign-up) {
            proxy_pass http://socialflow_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Dashboard + frontend
        location / {
            proxy_pass http://socialflow_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;
        }
    }
}
